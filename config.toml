
# ============================================================
# ORTELIUS.IO - HUGO CONFIGURATION
# SEO Optimized Configuration
# ============================================================

# Site configuration
baseURL = "https://ortelius.io/"
title = "Ortelius"

# Hugo Docsy theme
theme = ["github.com/google/docsy", "github.com/google/docsy/dependencies"]

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Search engine crawling
enableRobotsTXT = true

# Existing site behavior
disableBrowserError = true
enableSourceMap = false

# Preserve existing taxonomy configuration.
# Remove "taxonomy" only if you plan to publish tag/category pages.
disableKinds = ["taxonomy"]

# Files excluded from Hugo processing
ignoreFiles = [
  "(?:^|/)OWNERS$",
  "README[-]+[a-z]*\\.md",
  "^node_modules$",
  "content/en/docs/doc-contributor-tools"
]

timeout = 3000

# ============================================================
# SYNTAX HIGHLIGHTING
# ============================================================

pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "emacs"

# Git metadata for page modification dates
enableGitInfo = true

# ============================================================
# FRONT MATTER
# ============================================================

[frontmatter]
date = ["date", ":filename", "publishDate", "lastmod"]

# ============================================================
# PERMALINKS
# IMPORTANT: Preserve existing URLs for indexed blog posts.
# ============================================================

[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

# ============================================================
# XML SITEMAP
# ============================================================

[sitemap]
filename = "sitemap.xml"
priority = 0.75

# ============================================================
# OUTPUT FORMATS
# ============================================================

[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML"]

# ============================================================
# LEGACY MARKDOWN SETTINGS
# Preserved from existing configuration
# ============================================================

[blackfriday]
plainIDAnchors = true
hrefTargetBlank = true
angledQuotes = false
latexDashes = true

# ============================================================
# IMAGE PROCESSING
# ============================================================

[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

# ============================================================
# GOOGLE ANALYTICS
# ============================================================

[services]
[services.googleAnalytics]

# Google Analytics is already included in head.html.
# Leave disabled here to avoid duplicate GA4 initialization.
# id = "G-D9DFNW3B0V"

# ============================================================
# MARKDOWN RENDERING
# ============================================================

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ============================================================
# SITE PARAMETERS AND SEO
# ============================================================

[params]

copyright = "Linux Foundation"

# Sitewide SEO description
# Used by the updated head.html when individual pages
# do not provide a description.

description = "Ortelius is an open-source software supply chain vulnerability management platform that connects SBOMs with deployed applications and endpoints to identify, locate, track and fix software vulnerabilities impacting live environments."

# Social sharing images
# Uncomment after adding an actual image at:
# static/images/ortelius-social.png
#
# images = ["images/ortelius-social.png"]

# ============================================================
# DOCSY VERSION SETTINGS
# ============================================================

version_menu = "Releases"

archived_version = false

version = "9.0"

url_latest_version = "https://docs.ortelius.io"

# ============================================================
# GITHUB REPOSITORY SETTINGS
# ============================================================

# Uncomment if you want Docsy edit and issue links.
# github_repo = "https://github.com/ortelius/ortelius.io"
# github_branch = "main"

# Optional related project repository
# github_project_repo = "https://github.com/ortelius/ortelius"

# github_subdir = ""

# ============================================================
# SITE SEARCH
# ============================================================

# Google Custom Search Engine
# gcs_engine_id = "011737558837375720776:fsdu1nryfng"

# Algolia DocSearch
# algolia_docsearch = false

# Enable Lunr offline search if desired.
# offlineSearch = false

# ============================================================
# DOCSY USER INTERFACE
# ============================================================

[params.ui]

sidebar_menu_compact = false

# Keep breadcrumb navigation enabled.
# Useful for navigation and internal linking.
breadcrumb_disable = false

sidebar_search_disable = false

navbar_logo = true

footer_about_enable = false

# ============================================================
# DOCSY FEEDBACK
# ============================================================

[params.ui.feedback]

enable = true

yes = 'Glad to hear it! Please <a href="https://github.com/ortelius/website/issues/new">tell us how we can improve</a>.'

no = 'Sorry to hear that. Please <a href="https://github.com/ortelius/website/issues/new">tell us how we can improve</a>.'

navbar_translucent_over_cover_disable = true

# ============================================================
# DOCSY READING TIME
# ============================================================

[params.ui.readingtime]

enable = false

# ============================================================
# SOCIAL AND COMMUNITY LINKS
# ============================================================

[params.links]

# LinkedIn
[[params.links.user]]
name = "LinkedIn"
url = "https://www.linkedin.com/company/ortelius-open-source/"
icon = "fab fa-linkedin"
desc = "Follow us on LinkedIn to get the latest news!"

# YouTube
[[params.links.user]]
name = "YouTube"
url = "https://www.youtube.com/@orteliusopensource1086"
icon = "fab fa-youtube"
desc = "Follow us on YouTube to get the latest videos!"

# GitHub
[[params.links.developer]]
name = "GitHub"
url = "https://github.com/ortelius/ortelius"
icon = "fab fa-github"
desc = "Development takes place here!"

# ============================================================
# MAIN NAVIGATION
# ============================================================

[[menu.main]]
name = "Documentation"
weight = 90
url = "https://docs.ortelius.io/guides/"

[[menu.main]]
name = "SaaS Login"
weight = 92
url = "https://app.deployhub.com/"
